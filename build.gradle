plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            programArguments.addAll('--width', '1600', '--height', '900')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Visual check: ./gradlew runClient -PquickPlay=<world in run/saves> [-PwithSodium=<sodium jar>]
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
                systemProperty(project.hasProperty('probe') ? 'renovator.probe' : project.hasProperty('gallery') ? 'renovator.gallery' : 'renovator.devScene', 'true')
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    if (project.hasProperty('withSodium')) {
        localRuntime files(project.property('withSodium'))
    }
    // Optional ProjectE in dev runs: -PwithProjectE=<path to ProjectE jar> (EMC tests assert only when present).
    if (project.hasProperty('withProjectE')) {
        localRuntime files(project.property('withProjectE'))
    }
    // Furniture mods etc. in dev runs only: -PwithMods=<jar>;<jar>;...
    if (project.hasProperty('withMods')) {
        project.property('withMods').toString().split(';').each { if (it.trim()) localRuntime files(it.trim()) }
    }
}

// Game tests and the dev scene only run in the dev environment; keep them out of the release jar.
tasks.named('jar', Jar) {
    exclude 'com/renovator/test/**'
    exclude 'data/renovator/structure/**'
    exclude 'data/renovator/renovator_fixtures/**'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Lets scripts drive the dev server console.
tasks.matching { it.name == 'runServer' }.configureEach { standardInput = System.in }
