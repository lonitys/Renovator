modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Lonitys"
logoFile="renovator_logo.png"
logoBlur=false
description='''
Renovate any building with one wand: swap its style by block family, mix palettes instead of flat walls, get detail
suggestions, furnish rooms (vanilla or Macaw's / Refurbished furniture), copy buildings and import .schem/.litematic/.nbt
blueprints, and build them as ghost projections layer by layer - by hand or automatically in survival.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="projecte"
    type="optional"
    versionRange="[1.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mcwfurnitures"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="refurbished_furniture"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"
